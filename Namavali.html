    function renderNames() {
        const container = document.getElementById("namesContainer");
        const searchQuery = document.getElementById("searchInput").value.toLowerCase();
        const scriptType = document.getElementById("scriptSelect").value;
        
        container.innerHTML = "";

        allNames.forEach((item, index) => {
            const nameNumber = index + 1;
            let text = "";
            
            if (scriptType === "tamil") {
                text = `${nameNumber}. ${item[0]}`;
            } else if (scriptType === "devanagari") {
                text = `${nameNumber}. ${item[1]}`;
            } else if (scriptType === "english") {
                text = `${nameNumber}. ${item[2]}`;
            }

            if (text.toLowerCase().includes(searchQuery)) {
                const li = document.createElement("li");
                li.textContent = text;
                container.appendChild(li);
            }
        });
    }

    window.onload = function() {
        renderNames();
    };
